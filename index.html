<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IronPulse Gym Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login">
  <form id="lf" class="box">
    <div class="logo">🏋️ APEX_FITNESS<small>Gym Management System</small></div>
    <label>Username<input id="u" required autofocus></label>
    <label>Password<input id="p" type="password" required></label>
    <p id="lerr" class="err"></p>
    <button class="btn">Login</button>
    <p class="muted">Demo login: admin / admin123</p>
  </form>
</div>
<div id="app" hidden>
  <aside class="side">
    <div class="logo">🏋️ IronPulse<small>Gym Management</small></div>
    <nav>
      <a href="#dashboard" data-p="dashboard">📊 Dashboard</a>
      <a href="#members" data-p="members">👥 Members</a>
      <a href="#plans" data-p="plans">🎫 Plans</a>
      <a href="#payments" data-p="payments">💳 Payments</a>
      <a href="#trainers" data-p="trainers">🧑‍🏫 Trainers</a>
      <a href="#workouts" data-p="workouts">💪 Workouts</a>
      <a href="#reports" data-p="reports">📑 Reports</a>
      <a href="#admins" data-p="admins">🔐 Admins</a>
      <a href="#" onclick="logout();return false">🚪 Logout</a>
    </nav>
  </aside>
  <main><header class="top noprint"><h1 id="title"></h1><span class="muted" id="who"></span></header><section id="view"></section></main>
</div>
<dialog id="dlg"></dialog>
<script src="js/app.js"></script>
</body>
</html>
